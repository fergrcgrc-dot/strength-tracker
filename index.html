<style>
  :root{
    --bg-1:#101a2c; --bg-2:#15414c; --bg-3:#271050;
    --c-blue:#8FE1F7; --c-mint:#8FF7C9; --c-teal:#12838C; --c-lavender:#C9A8F5; --c-violet:#6A0DC9;
    --ink:#10121a;
    --text:#F3F1EC; --text-dim:#C7CAD3; --text-faint:#9498a5;
    --bg-card:rgba(22,24,34,.66); --bg-card-2:rgba(255,255,255,.09); --bg-card-3:rgba(255,255,255,.14);
    --border:rgba(255,255,255,.16);
    --tint-superior:rgba(143,225,247,.30); --tint-inferior:rgba(18,131,140,.50); --tint-core:rgba(201,168,245,.32); --tint-violet:rgba(106,13,201,.46);
    padding-top:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    background:
      radial-gradient(circle at 10% -8%, rgba(143,225,247,.42), transparent 45%),
      radial-gradient(circle at 108% 12%, rgba(106,13,201,.55), transparent 50%),
      radial-gradient(circle at 50% 118%, rgba(143,247,201,.32), transparent 48%),
      linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 48%, var(--bg-3) 100%);
    background-attachment:fixed;
    color:var(--text); min-height:100%;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app-root{max-width:480px; margin:0 auto; min-height:100vh; position:relative;
    padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));}
  #tab-content{padding:18px 16px 8px;}

  button{font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  input,select,textarea{font-family:inherit; color:var(--text); background:var(--bg-card-2);
    border:1px solid var(--border); border-radius:8px;}
  input::placeholder{color:var(--text-faint);}
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--c-blue); outline-offset:2px;
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important;} }

  /* Day header */

<div id="app-root">
  <div id="tab-content"></div>
  <nav class="bottom-nav">
    <button class="nav-btn" data-tab="hoy">Hoy</button>
    <button class="nav-btn" data-tab="progreso">Progreso</button>

<script>
/* ---------- Rutina (catálogo fijo) ---------- */
const ROUTINE = {
  mon:{ label:'Lunes',
    mediodia:{ title:'Espalda y bíceps', note:'Compatible con el press de banca de la tarde: nada de remo muy pesado ni de agarre al límite.',
      exercises:[
        {id:'mon_remo', name:'Remo con pecho apoyado o remo sentado en cable', target:'3 × 6–10', rir:'2 RIR', cat:'superior', restTime:"2' rest"},
        {id:'mon_jalon', name:'Jalón al pecho, agarre neutro', target:'3 × 8–12', rir:'2 RIR', cat:'superior', restTime:"1'30 rest"},
        {id:'mon_facepull', name:'Reverse pec deck o face pull', target:'2 × 12–18', rir:'1–2 RIR', cat:'superior', restTime:"1' rest"},
        {id:'mon_curl', name:'Curl inclinado con mancuerna o en cable', target:'3 × 8–12', rir:'1–2 RIR', cat:'superior', restTime:"1' rest"},
        {id:'mon_martillo', name:'Curl martillo', target:'2 × 10–15', rir:'1–2 RIR', cat:'superior', restTime:"1' rest"},
      ]},
    tarde:{ title:'Press de banca', note:'Fuerza pesada, series bajas (3–4 reps, o hasta 9×1). Ajusta tú el número de series.', exerciseId:'mon_press_banca', exerciseName:'Press de banca', category:'superior', rir:'1 RIR', restTime:"3' rest"}
  },
  tue:{ label:'Martes',
    mediodia:{ title:'Pierna, hipertrofia y resiliencia', note:'Si la rodilla protesta, quita primero el búlgaro y mantén prensa, curl femoral y extensión unilateral.',
      exercises:[
        {id:'tue_rdl', name:'Peso muerto rumano', target:'3 × 6–8', rir:'2 RIR', cat:'inferior', restTime:"2' rest"},
        {id:'tue_prensa', name:'Prensa inclinada o hack squat', target:'3 × 8–12', rir:'2–3 RIR', cat:'inferior', restTime:"1'30 rest"},
        {id:'tue_bulgaro', name:'Split squat búlgaro con mancuernas', target:'2 × 8–10 / pierna', rir:'2–3 RIR', cat:'inferior', restTime:"1'30 rest"},
        {id:'tue_femoral', name:'Curl femoral', target:'3 × 10–15', rir:'1–2 RIR', cat:'inferior', restTime:"1' rest"},
        {id:'tue_extension', name:'Extensión de rodilla unilateral', target:'2 × 12–15 / pierna', rir:'2–3 RIR', cat:'inferior', restTime:"1' rest"},
        {id:'tue_gemelo', name:'Elevación de gemelo sentado', target:'2 × 12–20', rir:'1–2 RIR', cat:'inferior', restTime:"1' rest"},
      ]},
    tarde:null
  },
  wed:{ label:'Miércoles',
    mediodia:{ title:'Core y técnica overhead ligera', note:'Press vertical fácil-moderado: no debe fatigar el hombro antes de las dominadas.',
      exercises:[
        {id:'wed_press', name:'Press militar sentado con mancuernas o landmine', target:'3 × 6–8', rir:'3 RIR', cat:'superior', restTime:"2' rest"},
        {id:'wed_lateral', name:'Elevación lateral', target:'2 × 12–20', rir:'2 RIR', cat:'superior', restTime:"1' rest"},
        {id:'wed_abwheel', name:'Ab wheel o body saw', target:'3 × 6–12', rir:'técnica', cat:'core', restTime:"45s rest"},
        {id:'wed_pallof', name:'Pallof press', target:'3 × 10–12 / lado', rir:'', cat:'core', restTime:"45s rest"},
        {id:'wed_farmerswalk', name:"Farmer's walk a un brazo", target:'3 × 20–30 m / lado', rir:'', cat:'core', restTime:"1' rest"},
        {id:'wed_plancha', name:'Plancha lateral', target:'2 × 30–45 s / lado', rir:'', cat:'core', restTime:"45s rest"},
      ]},
    tarde:{ title:'Dominadas', note:'Fuerza pesada, lastradas si hace falta. Ajusta tú series y repeticiones.', exerciseId:'wed_dominadas', exerciseName:'Dominadas', category:'superior', rir:'1 RIR', restTime:"3' rest"}
  },
  thu:{ label:'Jueves', mediodia:null, recovery:true,
    tarde:{ title:'Sentadilla', note:'Exposición principal de sentadilla trasera de la semana. Ajusta tú series y repeticiones.', exerciseId:'thu_sentadilla', exerciseName:'Sentadilla trasera', category:'inferior', rir:'1 RIR', restTime:"3' rest"}
  },
  fri:{ label:'Viernes',
    mediodia:{ title:'Fuerza ATHX: peso muerto y press vertical', note:'Sin HIIT por la tarde: puedes apretar algo más, siempre sin llegar al fallo.',
      exercises:[
        {id:'fri_pesomuerto', name:'Peso muerto convencional, trap bar o sumo', target:'4 × 3–5', rir:'2 RIR', cat:'inferior', restTime:"3' rest"},
        {id:'fri_press', name:'Press estricto de pie', target:'4 × 4–6', rir:'2 RIR', cat:'superior', restTime:"3' rest"},
        {id:'fri_inclinado', name:'Press inclinado con mancuernas', target:'2 × 8–10', rir:'2 RIR', cat:'superior', restTime:"1'30 rest"},
        {id:'fri_remo', name:'Remo en máquina o pecho apoyado', target:'2 × 8–12', rir:'2 RIR', cat:'superior', restTime:"1'30 rest"},
        {id:'fri_hipthrust', name:'Hip thrust o extensión de espalda a 45°', target:'2 × 8–12', rir:'2 RIR', cat:'inferior', restTime:"1'30 rest"},
        {id:'fri_triceps', name:'Extensión de tríceps en cuerda', target:'2 × 10–15', rir:'1–2 RIR', cat:'superior', restTime:"1' rest"},
      ]},
    tarde:null
  },
  sat:{ label:'Sábado', mediodia:null, tarde:null, optional:true },
  sun:{ label:'Domingo', mediodia:null, tarde:null, rest:true },
};

const FLAT_EXERCISES = {};
Object.entries(ROUTINE).forEach(([dayKey, day])=>{
  if(day.mediodia){
    day.mediodia.exercises.forEach(ex=>{
      FLAT_EXERCISES[ex.id] = {...ex, dayKey, session:'mediodia', dayLabel:day.label, blockTitle:day.mediodia.title};
    });
  }
  if(day.tarde){
    FLAT_EXERCISES[day.tarde.exerciseId] = {id:day.tarde.exerciseId, name:day.tarde.exerciseName, target:'', rir:day.tarde.rir||'',
      cat:day.tarde.category, restTime:day.tarde.restTime, dayKey, session:'tarde', dayLabel:day.label, blockTitle:day.tarde.title};
  }
});

const CATEGORIES = [
  {id:'superior', label:'Tren superior'},
  {id:'inferior', label:'Tren inferior'},
  {id:'core', label:'Core'},
];

const DAY_NAMES = {mon:'Lunes',tue:'Martes',wed:'Miércoles',thu:'Jueves',fri:'Viernes',sat:'Sábado',sun:'Domingo'};
const MONTHS_SHORT = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* ---------- Utilidades de fecha ---------- */
function toDateId(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dayKeyFromDate(d){ return ['sun','mon','tue','wed','thu','fri','sat'][d.getDay()]; }
function formatDateShort(dateId){ const [y,m,d]=dateId.split('-').map(Number); return `${d} ${MONTHS_SHORT[m-1]}`; }
function formatWeight(w){
  if(w===null||w===undefined||isNaN(w)) return '-';
  const r=Math.round(w*10)/10;
  return Number.isInteger(r) ? String(r) : String(r).replace('.',',');
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function parseRir(rirStr){
  if(!rirStr) return 2;
  const nums = (String(rirStr).match(/\d+(\.\d+)?/g)||[]).map(Number);
  if(!nums.length) return 2;
  if(nums.length===1) return nums[0];
  return (nums[0]+nums[1])/2;
}
function calcE1RM(weight, reps, rirValue){
  const effReps = reps + rirValue;
  if(!weight || weight<=0 || effReps<=0) return 0;
  return weight * (1 + effReps/30);
}
function bestE1RM(history, rirValue){
  let best = 0;
  history.forEach(h=>{
    h.sets.forEach(s=>{
      const e = calcE1RM(s.weight, s.reps, rirValue);
      if(e>best) best = e;
    });
  });
  return best;
}
function rawNum(n){ return String(Math.round(n*10)/10); }
function withTimeout(promise, ms){
  ms = ms || 6000;
  return Promise.race([
    promise,
    new Promise((_,reject)=> setTimeout(()=>reject(new Error('timeout')), ms))
  ]);
}
function deepClone(obj){
  if(obj===null || obj===undefined) return obj;
  try{ return JSON.parse(JSON.stringify(obj)); }
  catch(e){ return obj; }
}
function showToast(msg, persist){
  let t = document.getElementById('app-toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'app-toast';
    t.className = 'app-toast';
    t.addEventListener('click', ()=> t.classList.remove('show'));
    document.getElementById('app-root').appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  if(!persist) t._hideTimer = setTimeout(()=> t.classList.remove('show'), 3000);
}
window.addEventListener('error', function(e){
  try{ showToast('Error: ' + (e.message || 'desconocido'), true); }catch(_e){}
});
window.addEventListener('unhandledrejection', function(e){
  try{
    const r = e.reason;
    const msg = (r && r.message) ? r.message : String(r);
    showToast('Error async: ' + msg, true);
  }catch(_e){}
});

/* ---------- Almacenamiento (db si está disponible, si no localStorage) ---------- */
const Store = (()=>{
  let db=null, mode='local';
  async function init(){
    try{ if(window.claude && window.claude.use){ db = await withTimeout(window.claude.use('db'), 2200); } }
    catch(e){ db=null; }
    mode = db ? 'db' : 'local';
    return mode;
  }
  function localKey(id){ return 'fertrack_log_'+id; }
  async function getLog(dateId){
    if(db){
      try{ const snap = await withTimeout(db.doc('logs/'+dateId).get()); return snap.exists ? deepClone(snap.data()) : null; }
      catch(e){ console.error(e); return null; }
    }else{
      try{ const raw = localStorage.getItem(localKey(dateId)); return raw ? JSON.parse(raw) : null; }
      catch(e){ return null; }
    }
  }
  async function saveLog(dateId, data){
    if(db){
      try{ await withTimeout(db.doc('logs/'+dateId).set(data)); return true; }
      catch(e){ console.error(e); return false; }
    }else{
      try{ localStorage.setItem(localKey(dateId), JSON.stringify(data)); return true; }
      catch(e){ return false; }
    }
  }
  async function queryByDayKey(dayKey, limitN){
    if(db){
      try{
        const snap = await withTimeout(db.collection('logs').where('dayKey','==',dayKey).orderBy('date','desc').limit(limitN).get());
        return snap.docs.map(d=>deepClone(d.data()));
      }catch(e){ console.error(e); return []; }
    }else{
      const results=[];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf('fertrack_log_')===0){
          try{ const data = JSON.parse(localStorage.getItem(k)); if(data && data.dayKey===dayKey) results.push(data); }
          catch(e){}
        }
      }
      results.sort((a,b)=> b.date.localeCompare(a.date));
      return results.slice(0, limitN);
    }
  }
  function rmLocalKey(id){ return 'fertrack_rm_'+id; }
  async function getRmOverride(exId){
    if(db){
      try{ const snap = await withTimeout(db.doc('rm/'+exId).get()); return (snap.exists && typeof snap.data().value==='number') ? snap.data().value : null; }
      catch(e){ console.error(e); return null; }
    }else{
      try{ const raw = localStorage.getItem(rmLocalKey(exId)); return raw!==null ? parseFloat(raw) : null; }
      catch(e){ return null; }
    }
  }
  async function setRmOverride(exId, value){
    if(db){
      try{
        if(value===null){ await withTimeout(db.doc('rm/'+exId).delete()); }
        else{ await withTimeout(db.doc('rm/'+exId).set({value})); }
        return true;
      }catch(e){ console.error(e); return false; }
    }else{
      try{
        if(value===null) localStorage.removeItem(rmLocalKey(exId));
        else localStorage.setItem(rmLocalKey(exId), String(value));
        return true;
      }catch(e){ return false; }
    }
  }
  async function queryRecent(limitN){
    if(db){
      try{
        const snap = await withTimeout(db.collection('logs').orderBy('date','desc').limit(limitN).get());
        return snap.docs.map(d=>deepClone(d.data()));
      }catch(e){ console.error(e); return []; }
    }else{
      const results=[];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf('fertrack_log_')===0){
          try{ const data = JSON.parse(localStorage.getItem(k)); if(data) results.push(data); }
          catch(e){}
        }
      }
      results.sort((a,b)=> b.date.localeCompare(a.date));
      return results.slice(0, limitN);
    }
  }
  return { init, getLog, saveLog, queryByDayKey, queryRecent, getRmOverride, setRmOverride, get mode(){ return mode; } };
})();

function getLastTimeFromHistory(history, exerciseId){
  const sessions = ['mediodia','tarde','extra'];
  for(const d of history){

      const sess = d[s];
      if(sess && sess.exercises && sess.exercises[exerciseId] && sess.exercises[exerciseId].sets && sess.exercises[exerciseId].sets.length){
        return { date:d.date, sets:sess.exercises[exerciseId].sets };
      }
    }
  }
  return null;
}

/* ---------- Render: pestaña Progreso ---------- */
function renderChart(history){
  if(history.length < 2) return '<div class="chart-empty">Necesitas al menos dos sesiones registradas para ver la evolución.</div>';
  const points = history.map(h => Math.max(...h.sets.map(s=>s.weight)));
  const min = Math.min(...points), max = Math.max(...points), range = (max-min) || 1;
  const w=300, h=100, pad=10;
  const stepX = (w-pad*2) / (points.length-1);
  const coords = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h - pad - ((p-min)/range) * (h-pad*2);
    return [x,y];
  });
  const pathD = coords.map((c,i)=> (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const circles = coords.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" class="chart-dot"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg" preserveAspectRatio="none">
      <path d="${pathD}" class="chart-line" fill="none"/>${circles}
    </svg>
    <div class="chart-range"><span>${formatWeight(min)}kg</span><span>${formatWeight(max)}kg</span></div>`;
}

async function loadProgressDetail(exId){
  const info = FLAT_EXERCISES[exId];
  const detail = document.getElementById('progress-detail');
  if(!detail) return;
  const docs = await Store.queryRecent(40);
  const history = [];
  const sessions = ['mediodia','tarde','extra'];
  docs.forEach(d=>{
    for(const s of sessions){
      const sess = d[s];
      if(sess && sess.exercises && sess.exercises[exId] && sess.exercises[exId].sets && sess.exercises[exId].sets.length){
        history.push({ date:d.date, sets:sess.exercises[exId].sets });
        break;
      }
    }
  });
  history.sort((a,b)=> a.date.localeCompare(b.date));

  const rirValue = parseRir(info.rir);
  const calculatedRM = bestE1RM(history, rirValue);
  const manualRM = await Store.getRmOverride(exId);
  const isManual = (manualRM!==null && manualRM!==undefined);
  const effectiveRM = isManual ? manualRM : calculatedRM;

  let bodyHtml = `
    <div class="exercise-meta">
      <div class="exercise-meta-name">${info.name}</div>
      <div class="exercise-meta-sub">${info.dayLabel} · ${info.blockTitle}</div>
    </div>
    ${renderRmCard(effectiveRM, isManual)}
  `;

  if(!history.length){
    bodyHtml += '<div class="empty-state">Todavía no hay registros de este ejercicio.</div>';
  }else{
    const chartHtml = renderChart(history);
    const listHtml = history.slice().reverse().map(h=>`
      <div class="history-row">
        <div class="history-date">${formatDateShort(h.date)}</div>
        <div class="history-sets">${h.sets.map(s=>`${formatWeight(s.weight)}kg×${s.reps}`).join(', ')}</div>
      </div>`).join('');
    bodyHtml += `<div class="chart-wrap">${chartHtml}</div><div class="history-list">${listHtml}</div>`;
  }
  detail.innerHTML = bodyHtml;
}

/* ---------- Render: pestaña Rutina ---------- */
function renderRutinaDay(dayKey, day){
  let body = '';
  if(day.rest) body = `<p class="rutina-note">Descanso total.</p>`;
  else if(day.optional) body = `<p class="rutina-note">Sesión específica opcional por la mañana. Si no hay sesión, elige solo una cosa: rodaje suave, técnica corta o recuperación activa.</p>`;
  else{
    if(day.recovery) body += `<p class="rutina-note">Mediodía de recuperación: bici suave, movilidad, o descanso si vienes cargado.</p>`;
    else if(day.mediodia){
      body += `<div class="rutina-block-title">${day.mediodia.title}</div>`;
      body += `<ul class="rutina-ex-list">${day.mediodia.exercises.map(ex=>`<li>${ex.name} — ${ex.target}${ex.rir ? ', '+ex.rir : ''}${ex.restTime ? ' · '+ex.restTime : ''}</li>`).join('')}</ul>`;
    }
    if(day.tarde){
      body += `<div class="rutina-block-title rutina-tarde-title">Tarde · ${day.tarde.title}${day.tarde.restTime ? ' · '+day.tarde.restTime : ''}</div>`;
      body += `<p class="rutina-note">${day.tarde.note}</p>`;
    }
  }
  return `<details class="rutina-day"><summary>${day.label}</summary><div class="rutina-day-body">${body}</div></details>`;
}

function renderRutina(container){
  const order = ['mon','tue','wed','thu','fri','sat','sun'];
  const cards = order.map(k=>renderRutinaDay(k, ROUTINE[k])).join('');
  container.innerHTML = `
    <div class="tab-header"><h1>Rutina</h1></div>
    <div class="guidelines-card">
      <div class="info-title">Pautas generales</div>
      <ul class="guidelines-list">
        <li>RIR 1–3 en básicos, no busques el fallo</li>
        <li>Descansos: 2–3 min en principales, 60–90 s en accesorios, 45–60 s en core</li>
        <li>Calentamiento 5–7 min: bici o remo suave, movilidad, 2–3 series de aproximación</li>
      </ul>
    </div>
    ${cards}
    <div class="store-note">${Store.mode==='db' ? 'Los registros se guardan en este artefacto y se sincronizan entre dispositivos.' : 'Los registros se están guardando solo en este dispositivo (modo local).'}</div>
  `;
}

/* ---------- Orquestación ---------- */
async function render(){
  document.querySelectorAll('.nav-btn').forEach(b=> b.classList.toggle('active', b.getAttribute('data-tab')===state.tab));
  const content = document.getElementById('tab-content');
  if(state.tab==='hoy') await renderHoy(content);
  else if(state.tab==='progreso') await renderProgreso(content);
  else renderRutina(content);
}

async function onAppClick(e){
 try{
  const navBtn = e.target.closest('[data-tab]');
  if(navBtn){ state.tab = navBtn.getAttribute('data-tab'); await render(); return; }

  const prevBtn = e.target.closest('[data-action="nav-prev"]');
  if(prevBtn){ state.currentDate.setDate(state.currentDate.getDate()-1); await render(); return; }
  const nextBtn = e.target.closest('[data-action="nav-next"]');
  if(nextBtn){ state.currentDate.setDate(state.currentDate.getDate()+1); await render(); return; }
  const todayBtn = e.target.closest('[data-action="nav-today"]');
  if(todayBtn){ state.currentDate = new Date(); await render(); return; }

  const addBtn = e.target.closest('[data-action="add-set"]');
  if(addBtn){
    const card = addBtn.closest('[data-exercise-id]');
    const exId = card.getAttribute('data-exercise-id'), session = card.getAttribute('data-session');
    const weightInput = card.querySelector('[data-weight-input]'), repsInput = card.querySelector('[data-reps-input]');
    const weight = parseFloat(String(weightInput.value).trim().replace(',', '.')), reps = parseInt(String(repsInput.value).replace(/[^\d]/g,''),10);
    if(isNaN(weight) || isNaN(reps)){ weightInput.focus(); return; }
    if(!state.logData[session].exercises[exId]) state.logData[session].exercises[exId] = {sets:[]};
    state.logData[session].exercises[exId].sets.push({weight, reps, ts:Date.now()});
    weightInput.value=''; repsInput.value='';
    card.querySelector('[data-sets-list]').innerHTML = renderSetsList(state.logData[session].exercises[exId].sets);
    weightInput.focus();
    Store.saveLog(state.logData.date, state.logData).then(ok=>{ if(!ok) showToast('No se pudo guardar, revisa tu conexión'); });
    return;
  }
  const delBtn = e.target.closest('[data-action="del-set"]');
  if(delBtn){
    const card = delBtn.closest('[data-exercise-id]');
    const exId = card.getAttribute('data-exercise-id'), session = card.getAttribute('data-session');
    const idx = parseInt(delBtn.getAttribute('data-index'),10);
    state.logData[session].exercises[exId].sets.splice(idx,1);
    card.querySelector('[data-sets-list]').innerHTML = renderSetsList(state.logData[session].exercises[exId].sets);
    Store.saveLog(state.logData.date, state.logData).then(ok=>{ if(!ok) showToast('No se pudo guardar, revisa tu conexión'); });
    return;
  }
  const editSetBtn = e.target.closest('[data-action="edit-set"]');
  if(editSetBtn){
    const card = editSetBtn.closest('[data-exercise-id]');
    const exId = card.getAttribute('data-exercise-id'), session = card.getAttribute('data-session');
    const idx = parseInt(editSetBtn.getAttribute('data-index'),10);
    const setsArr = state.logData[session].exercises[exId].sets;
    const target = setsArr[idx];
    if(!target) return;
    setsArr.splice(idx,1);
    card.querySelector('[data-sets-list]').innerHTML = renderSetsList(setsArr);
    const weightInput = card.querySelector('[data-weight-input]'), repsInput = card.querySelector('[data-reps-input]');
    weightInput.value = rawNum(target.weight);
    repsInput.value = target.reps;
    weightInput.focus();
    Store.saveLog(state.logData.date, state.logData).then(ok=>{ if(!ok) showToast('No se pudo guardar, revisa tu conexión'); });
    return;
  }

  const completeBtn = e.target.closest('[data-action="toggle-complete"]');
  if(completeBtn){
    const notesArea = document.querySelector('[data-notes]');
    if(notesArea) state.logData.notes = notesArea.value;
    state.logData.completed = !state.logData.completed;
    completeBtn.classList.toggle('is-complete', state.logData.completed);
    completeBtn.textContent = state.logData.completed ? '✓ Día completado' : 'Marcar día como completado';
    const badge = document.querySelector('.day-date');
    if(badge){ badge.innerHTML = formatDateShort(state.logData.date) + (state.logData.completed ? ' <span class="done-badge">✓</span>' : ''); }
    Store.saveLog(state.logData.date, state.logData).then(ok=>{ if(!ok) showToast('No se pudo guardar, revisa tu conexión'); });
    return;
  }
  const toggleAddEx = e.target.closest('[data-action="toggle-add-exercise"]');
  if(toggleAddEx){
    state.addExerciseOpen = !state.addExerciseOpen;
    state.addExerciseCategory = null;
    refreshHoyContent();
    return;
  }
  const addExCat = e.target.closest('[data-action="add-exercise-select-category"]');
  if(addExCat){
    state.addExerciseCategory = addExCat.getAttribute('data-category');
    refreshHoyContent();
    return;
  }
  const addExBackCat = e.target.closest('[data-action="add-exercise-back-cat"]');
  if(addExBackCat){
    state.addExerciseCategory = null;
    refreshHoyContent();
    return;
  }
  const addExPick = e.target.closest('[data-action="add-exercise-pick"]');
  if(addExPick){
    const exId = addExPick.getAttribute('data-exercise-id');
    state.logData.extra.exercises[exId] = {sets:[]};
    state.addExerciseOpen = false;
    state.addExerciseCategory = null;
    refreshHoyContent();
    Store.saveLog(state.logData.date, state.logData).then(ok=>{ if(!ok) showToast('No se pudo guardar, revisa tu conexión'); });
    return;
  }
  const removeExtraBtn = e.target.closest('[data-action="remove-extra"]');
  if(removeExtraBtn){
    const exId = removeExtraBtn.getAttribute('data-exercise-id');
    delete state.logData.extra.exercises[exId];
    refreshHoyContent();
    Store.saveLog(state.logData.date, state.logData).then(ok=>{ if(!ok) showToast('No se pudo guardar, revisa tu conexión'); });
    return;
  }

  const catBtn = e.target.closest('[data-action="select-category"]');
  if(catBtn){ state.progressCategory = catBtn.getAttribute('data-category'); state.progressExerciseId = null; await render(); return; }
  const backCat = e.target.closest('[data-action="back-category"]');
  if(backCat){ state.progressCategory = null; await render(); return; }
  const exPick = e.target.closest('[data-action="select-exercise"]');
  if(exPick){ state.progressExerciseId = exPick.getAttribute('data-exercise-id'); await render(); return; }
  const backEx = e.target.closest('[data-action="back-exercise"]');
  if(backEx){ state.progressExerciseId = null; await render(); return; }

  const editRmBtn = e.target.closest('[data-action="edit-rm"]');
  if(editRmBtn){
    const row = document.querySelector('[data-rm-edit-row]');
    if(row){ row.hidden = !row.hidden; if(!row.hidden){ const inp = row.querySelector('[data-rm-input]'); if(inp) inp.focus(); } }
    return;
  }
  const saveRmBtn = e.target.closest('[data-action="save-rm"]');
  if(saveRmBtn){
    const input = document.querySelector('[data-rm-input]');
    const val = parseFloat(String(input.value).trim().replace(',', '.'));
    if(!isNaN(val) && val>0 && state.progressExerciseId){
      const exId = state.progressExerciseId;
      const detail = document.getElementById('progress-detail');
      if(detail){
        const rmCardEl = detail.querySelector('.rm-card');
        if(rmCardEl) rmCardEl.outerHTML = renderRmCard(val, true);
      }
      Store.setRmOverride(exId, val).then(ok=>{ if(!ok) showToast('No se pudo guardar, revisa tu conexión'); });
    }
    return;
  }
  const clearRmBtn = e.target.closest('[data-action="clear-rm"]');
  if(clearRmBtn){
    if(state.progressExerciseId){
      const exId = state.progressExerciseId;
      Store.setRmOverride(exId, null).then(ok=>{ if(!ok) showToast('No se pudo guardar, revisa tu conexión'); });
      await loadProgressDetail(exId);
    }
    return;
  }
 }catch(err){
   showToast('Error al tocar: ' + (err && err.message ? err.message : String(err)), true);
 }
}

function onAppFocusOut(e){
  if(e.target.matches && e.target.matches('[data-notes]')){
    state.logData.notes = e.target.value;
    Store.saveLog(state.logData.date, state.logData).then(ok=>{ if(!ok) showToast('No se pudo guardar, revisa tu conexión'); });
  }
}

function onAppKeydown(e){
  if(e.key==='Enter' && e.target.matches && (e.target.matches('[data-reps-input]') || e.target.matches('[data-weight-input]'))){
    e.preventDefault();
    const card = e.target.closest('[data-exercise-id]');
    const btn = card && card.querySelector('[data-action="add-set"]');
    if(btn) btn.click();
  }
  if(e.key==='Enter' && e.target.matches && e.target.matches('[data-rm-input]')){
    e.preventDefault();
    const btn = document.querySelector('[data-action="save-rm"]');
    if(btn) btn.click();
  }
}

async function init(){
  const root = document.getElementById('app-root');
  root.addEventListener('click', onAppClick);
  root.addEventListener('focusout', onAppFocusOut);
  root.addEventListener('keydown', onAppKeydown);
  document.getElementById('tab-content').innerHTML = '<div class="loading">Cargando…</div>';
  let rendered = false;
  const safety = setTimeout(()=>{ if(!rendered){ rendered = true; render(); } }, 2500);
  try{ await Store.init(); }catch(e){}
  clearTimeout(safety);
  if(!rendered){ rendered = true; await render(); }
}
init();
</script>
